name: Expand Folio source
on:
  push:
    paths: [payload/READY]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract implementation
        run: |
          cat payload/part-*.txt | base64 --decode | tar -xJf -
          rm -rf payload
      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Add complete local Folio implementation"; git push; fi
