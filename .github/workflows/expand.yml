name: Expand Folio source
on:
  push:
    paths: [payload/READY]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive and extract
        run: |
          cat payload/part-*.txt | base64 --decode > /tmp/folio-source.tar.xz
          echo "28560e13e28c05bcbe39821d0b38a546b9285a06f24a74a880ecc02c612db9f6  /tmp/folio-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/folio-source.tar.xz
          npm run check
          rm -rf payload
          # The source archive includes a workflow file, but the Actions token
          # cannot create/update workflow files without workflows permission.
          # Keep this expansion limited to application source files.
          rm -f .github/workflows/check.yml
      - name: Commit tested source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add complete local Folio implementation"
            git push
          fi
